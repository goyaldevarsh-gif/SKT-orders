<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#DC143C">
    <title>SKT Orders - Shri Krishna Textiles</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/html2canvas@latest/dist/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        * { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Initialize IndexedDB
        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SKTOrdersDB', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('orders')) {
                        db.createObjectStore('orders', { keyPath: 'id', autoIncrement: true });
                    }
                    if (!db.objectStoreNames.contains('samples')) {
                        db.createObjectStore('samples', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        };

        // Generate PDF with optimized layout (10-12 photos per page)
        const generatePDF = async (order) => {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            let yPosition = 15;
            
            // Header
            doc.setFillColor(220, 20, 20);
            doc.rect(0, 0, pageWidth, 28, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(18);
            doc.setFont(undefined, 'bold');
            doc.text('SHRI KRISHNA TEXTILES', 15, 12);
            
            doc.setFontSize(10);
            doc.setFont(undefined, 'normal');
            doc.text(`Party: ${order.partyName} | Order #: ${order.orderNumber} | Date: ${order.date}`, 15, 21);
            
            yPosition = 35;
            
            // Samples in grid format (3 columns, optimized for 10-12 per page)
            const cols = 3;
            const colWidth = (pageWidth - 30) / cols;
            const imgSize = 30; // 30x30mm square
            let sampleCount = 0;
            
            order.samples.forEach((sample, index) => {
                const row = Math.floor(sampleCount / cols);
                const col = sampleCount % cols;
                
                // Check if need new page
                if (row > 3) {
                    doc.addPage();
                    yPosition = 15;
                    row = 0;
                    sampleCount = 0;
                }
                
                const xPos = 15 + col * colWidth;
                const yPos = yPosition + row * (imgSize + 18);
                
                // Image (30x30mm square)
                if (sample.photo || sample.photoPreview) {
                    try {
                        const photoData = sample.photo || sample.photoPreview;
                        doc.addImage(photoData, 'JPEG', xPos, yPos, imgSize, imgSize);
                    } catch (e) {
                        doc.setFillColor(220, 220, 220);
                        doc.rect(xPos, yPos, imgSize, imgSize);
                    }
                }
                
                // Quantity below image
                doc.setFont(undefined, 'bold');
                doc.setFontSize(9);
                doc.setTextColor(0, 0, 0);
                doc.text(`Qty: ${sample.quantity}`, xPos + 2, yPos + imgSize + 8);
                
                sampleCount++;
            });
            
            // Footer
            doc.setFontSize(8);
            doc.setTextColor(150, 150, 150);
            doc.setFont(undefined, 'normal');
            doc.text(`Generated by SKT Orders App`, 15, pageHeight - 8);
            
            return doc;
        };

        function App() {
            const [screen, setScreen] = useState('home');
            const [orders, setOrders] = useState([]);
            const [samples, setSamples] = useState([]);
            const [partyName, setPartyName] = useState('');
            const [currentOrderSamples, setCurrentOrderSamples] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [editingOrder, setEditingOrder] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const [photoData, setPhotoData] = useState(null);
            const [quantity, setQuantity] = useState('');
            const cameraRef = useRef(null);
            const fileInputRef = useRef(null);

            // Load data
            useEffect(() => {
                loadData();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./service-worker.js');
                }
            }, []);

            const loadData = async () => {
                try {
                    const db = await initDB();
                    const ordersStore = db.transaction('orders', 'readonly').objectStore('orders');
                    const samplesStore = db.transaction('samples', 'readonly').objectStore('samples');
                    
                    ordersStore.getAll().onsuccess = (e) => setOrders(e.target.result || []);
                    samplesStore.getAll().onsuccess = (e) => setSamples(e.target.result || []);
                } catch (err) {
                    console.log('DB Load Error:', err);
                }
            };

            const handlePhotoCapture = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        setPhotoData(event.target.result);
                        setPhotoPreview(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddSample = async () => {
                if (!photoData || !quantity) {
                    alert('Please capture photo and enter quantity');
                    return;
                }

                const newSample = {
                    id: Date.now(),
                    photo: photoData,
                    quantity: quantity
                };

                setCurrentOrderSamples([...currentOrderSamples, newSample]);
                setPhotoData(null);
                setPhotoPreview(null);
                setQuantity('');
            };

            const handleSaveOrder = async () => {
                if (!partyName || currentOrderSamples.length === 0) {
                    alert('Please enter party name and add samples');
                    return;
                }

                try {
                    const db = await initDB();
                    const order = {
                        partyName,
                        orderNumber: Math.floor(100000 + Math.random() * 900000),
                        date: new Date().toLocaleDateString(),
                        samples: currentOrderSamples,
                        status: 'pending',
                        createdAt: new Date().toISOString()
                    };

                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').add(order);

                    // Generate PDF
                    const doc = await generatePDF(order);
                    const fileName = `${order.partyName}_${order.date.replace(/\//g, '-')}_Order${order.orderNumber}.pdf`;
                    doc.save(fileName);

                    // Reset
                    setPartyName('');
                    setCurrentOrderSamples([]);
                    setScreen('orders');
                    loadData();
                } catch (err) {
                    alert('Error saving order');
                }
            };

            const handleEditOrder = async (updatedSamples) => {
                if (!editingOrder) return;

                try {
                    const db = await initDB();
                    const updatedOrder = {
                        ...editingOrder,
                        samples: updatedSamples
                    };

                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').put(updatedOrder);

                    setEditingOrder(null);
                    loadData();
                } catch (err) {
                    alert('Error updating order');
                }
            };

            const handleCompleteOrder = async (orderId) => {
                try {
                    const db = await initDB();
                    const order = orders.find(o => o.id === orderId);
                    if (!order) return;

                    const updatedOrder = { ...order, status: 'complete' };
                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').put(updatedOrder);

                    loadData();
                } catch (err) {
                    alert('Error updating order');
                }
            };

            const handleDeleteOrder = async (id) => {
                if (!window.confirm('Delete this order?')) return;
                try {
                    const db = await initDB();
                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').delete(id);
                    loadData();
                } catch (err) {
                    alert('Error deleting order');
                }
            };

            const handleBackup = () => {
                const data = {
                    orders: orders,
                    samples: samples,
                    backupDate: new Date().toISOString()
                };
                const dataStr = JSON.stringify(data, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `SKTOrders_Backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const db = await initDB();

                        // Clear and restore
                        let ordersTx = db.transaction('orders', 'readwrite');
                        ordersTx.objectStore('orders').clear();
                        data.orders.forEach(order => {
                            ordersTx.objectStore('orders').add(order);
                        });

                        let samplesTx = db.transaction('samples', 'readwrite');
                        samplesTx.objectStore('samples').clear();
                        data.samples.forEach(sample => {
                            samplesTx.objectStore('samples').add(sample);
                        });

                        alert('Data restored successfully!');
                        loadData();
                    } catch (err) {
                        alert('Error restoring backup');
                    }
                };
                reader.readAsText(file);
            };

            // HOME SCREEN
            if (screen === 'home') {
                return (
                    <div className="min-h-screen bg-gradient-to-b from-red-50 to-white flex flex-col items-center justify-center p-4">
                        <img src="./icon-192.png" alt="SKT" className="w-24 h-24 mb-6 rounded-full shadow-lg" />
                        <h1 className="text-3xl font-bold text-red-600 mb-8">SKT Orders</h1>
                        
                        <div className="w-full max-w-sm space-y-3">
                            <button
                                onClick={() => { setPartyName(''); setCurrentOrderSamples([]); setScreen('neworder'); }}
                                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-5 px-4 rounded-xl text-lg transition shadow-lg"
                            >
                                ➕ NEW ORDER
                            </button>
                            
                            <button
                                onClick={() => setScreen('orders')}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-5 px-4 rounded-xl text-lg transition shadow-lg"
                            >
                                📋 ORDERS ({orders.length})
                            </button>

                            <button
                                onClick={handleBackup}
                                className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition"
                            >
                                💾 BACKUP
                            </button>

                            <label className="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl text-center cursor-pointer transition">
                                📥 RESTORE
                                <input type="file" accept=".json" onChange={handleRestore} className="hidden" />
                            </label>
                        </div>
                    </div>
                );
            }

            // NEW ORDER SCREEN
            if (screen === 'neworder') {
                return (
                    <div className="min-h-screen bg-gray-50 overflow-x-hidden pb-24">
                        <div className="bg-red-600 text-white p-4 flex items-center gap-3 sticky top-0 z-10 shadow">
                            <button onClick={() => setScreen('home')} className="hover:bg-red-700 p-2 rounded-lg">
                                ← BACK
                            </button>
                            <h1 className="text-xl font-bold flex-1 truncate">New Order</h1>
                        </div>

                        <div className="w-full px-3 max-w-2xl mx-auto mt-4">
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Party Name *</label>
                                <input
                                    type="text"
                                    value={partyName}
                                    onChange={(e) => setPartyName(e.target.value)}
                                    placeholder="Enter party name"
                                    className="w-full px-3 py-3 border-2 border-gray-300 rounded-lg focus:border-red-600 focus:outline-none text-lg"
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                                <input
                                    type="text"
                                    value={new Date().toLocaleDateString()}
                                    disabled
                                    className="w-full px-3 py-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                />
                            </div>

                            {/* Photo Section */}
                            {!photoPreview && (
                                <div className="mb-4">
                                    <button
                                        onClick={() => cameraRef.current?.click()}
                                        className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-5 px-4 rounded-lg text-2xl transition"
                                    >
                                        📷 TAKE PHOTO
                                    </button>
                                    <input
                                        ref={cameraRef}
                                        type="file"
                                        accept="image/*"
                                        capture="environment"
                                        onChange={handlePhotoCapture}
                                        className="hidden"
                                    />
                                </div>
                            )}

                            {/* Photo Preview + Quantity */}
                            {photoPreview && (
                                <div className="mb-4 bg-white p-4 rounded-lg shadow">
                                    <img src={photoPreview} alt="Preview" className="w-40 h-40 object-cover rounded-lg mb-3" />
                                    
                                    <div className="mb-3">
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">Quantity *</label>
                                        <input
                                            type="number"
                                            value={quantity}
                                            onChange={(e) => setQuantity(e.target.value)}
                                            placeholder="Enter quantity"
                                            className="w-full px-3 py-2 border-2 border-gray-300 rounded-lg focus:border-red-600 focus:outline-none text-lg"
                                        />
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleAddSample}
                                            className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✓ ADD
                                        </button>
                                        <button
                                            onClick={() => { setPhotoData(null); setPhotoPreview(null); setQuantity(''); }}
                                            className="flex-1 bg-gray-400 hover:bg-gray-500 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✕ RETAKE
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Added Samples */}
                            <div className="mb-4">
                                <h3 className="font-bold text-gray-800 mb-2">📦 Samples Added ({currentOrderSamples.length})</h3>
                                <div className="space-y-2">
                                    {currentOrderSamples.map((sample, idx) => (
                                        <div key={sample.id} className="bg-white p-3 rounded-lg flex justify-between items-center shadow">
                                            <span className="font-semibold">Qty: <span className="text-red-600">{sample.quantity}</span></span>
                                            <button
                                                onClick={() => setCurrentOrderSamples(currentOrderSamples.filter(s => s.id !== sample.id))}
                                                className="text-red-600 hover:bg-red-50 px-3 py-1 rounded"
                                            >
                                                🗑️ DELETE
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Save Button */}
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg border-t-2 border-red-600">
                            <button
                                onClick={handleSaveOrder}
                                className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg transition"
                            >
                                💾 SAVE & PDF
                            </button>
                        </div>
                    </div>
                );
            }

            // ORDERS SCREEN
            if (screen === 'orders') {
                if (selectedOrder) {
                    return (
                        <div className="min-h-screen bg-gray-50 overflow-x-hidden pb-24">
                            <div className="bg-red-600 text-white p-4 flex items-center gap-3 sticky top-0 z-10 shadow">
                                <button
                                    onClick={() => setSelectedOrder(null)}
                                    className="hover:bg-red-700 p-2 rounded-lg"
                                >
                                    ← BACK
                                </button>
                                <h1 className="text-xl font-bold flex-1 truncate">Order #{selectedOrder.orderNumber}</h1>
                            </div>

                            <div className="w-full px-3 max-w-2xl mx-auto mt-4">
                                <div className="bg-white p-4 rounded-lg shadow mb-4">
                                    <p className="mb-2"><strong>Party:</strong> {selectedOrder.partyName}</p>
                                    <p className="mb-2"><strong>Date:</strong> {selectedOrder.date}</p>
                                    <p><strong>Status:</strong> <span className={selectedOrder.status === 'complete' ? 'text-green-600' : 'text-blue-600'}>{selectedOrder.status}</span></p>
                                </div>

                                <h3 className="font-bold text-gray-800 mb-3">📦 Samples ({selectedOrder.samples.length})</h3>
                                <div className="space-y-3 mb-20">
                                    {selectedOrder.samples.map((sample, idx) => (
                                        <div key={sample.id} className="bg-white p-3 rounded-lg shadow">
                                            <img src={sample.photo} alt="Sample" className="w-full h-40 object-cover rounded-lg mb-2" />
                                            <p className="font-semibold">📦 Qty: {sample.quantity}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg border-t-2 border-red-600 max-w-2xl mx-auto">
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                const doc = await generatePDF(selectedOrder);
                                                const fileName = `${selectedOrder.partyName}_${selectedOrder.date.replace(/\//g, '-')}_Order${selectedOrder.orderNumber}.pdf`;
                                                doc.save(fileName);
                                            }}
                                            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            📄 PDF
                                        </button>
                                        <button
                                            onClick={() => {
                                                setEditingOrder(selectedOrder);
                                                setSelectedOrder(null);
                                            }}
                                            className="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✏️ EDIT
                                        </button>
                                        <button
                                            onClick={() => {
                                                handleCompleteOrder(selectedOrder.id);
                                                setSelectedOrder(null);
                                            }}
                                            className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✓ DONE
                                        </button>
                                        <button
                                            onClick={() => {
                                                handleDeleteOrder(selectedOrder.id);
                                                setSelectedOrder(null);
                                            }}
                                            className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            🗑️ DELETE
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-gray-50 overflow-x-hidden">
                        <div className="bg-red-600 text-white p-4 flex items-center gap-3 sticky top-0 z-10 shadow">
                            <button onClick={() => setScreen('home')} className="hover:bg-red-700 p-2 rounded-lg">
                                ← BACK
                            </button>
                            <h1 className="text-xl font-bold flex-1 truncate">📋 Orders ({orders.length})</h1>
                        </div>

                        <div className="w-full px-3 max-w-2xl mx-auto py-4 pb-20">
                            <div className="space-y-3">
                                {orders.map((order) => (
                                    <div
                                        key={order.id}
                                        onClick={() => setSelectedOrder(order)}
                                        className={`p-4 rounded-lg shadow cursor-pointer transition ${
                                            order.status === 'complete' ? 'bg-green-100' : 'bg-white hover:shadow-lg'
                                        }`}
                                    >
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="font-bold text-gray-800">#{order.orderNumber}</p>
                                                <p className="text-gray-600">{order.partyName}</p>
                                                <p className="text-sm text-gray-500">{order.date} • {order.samples.length} samples</p>
                                            </div>
                                            <span className={`px-3 py-1 rounded-full text-sm font-semibold ${
                                                order.status === 'complete' ? 'bg-green-200 text-green-800' : 'bg-blue-200 text-blue-800'
                                            }`}>
                                                {order.status === 'complete' ? '✓ Complete' : 'Pending'}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {orders.length === 0 && (
                                <p className="text-center text-gray-500 mt-10">No orders yet</p>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW Error:', err));
        }
    </script>
</body>
</html>
