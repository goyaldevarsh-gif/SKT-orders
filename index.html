<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#DC143C">
    <title>SKT Orders - Shri Krishna Textiles</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" href="./icon-192.png">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/html2canvas@latest/dist/html2canvas.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
        .grid { display: grid; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        * { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect } = React;

        // Initialize IndexedDB
        const initDB = () => {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SKTOrdersDB', 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains('orders')) {
                        db.createObjectStore('orders', { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        };

        // Generate PDF - simple and reliable
        const generatePDFFile = (order) => {
            try {
                if (!order || !order.samples) return false;
                
                const jsPDF = window.jspdf?.jsPDF;
                if (!jsPDF) {
                    console.error('jsPDF not loaded');
                    return false;
                }

                const doc = new jsPDF('p', 'mm', 'a4');
                const pageWidth = doc.internal.pageSize.getWidth();
                const pageHeight = doc.internal.pageSize.getHeight();
                const margin = 10;

                const drawHeader = () => {
                    // Firm header - dark gray for clean B&W printing
                    doc.setFillColor(40, 40, 40);
                    doc.rect(0, 0, pageWidth, 22, 'F');

                    doc.setTextColor(255, 255, 255);
                    doc.setFontSize(15);
                    doc.setFont(undefined, 'bold');
                    doc.text('SHRI KRISHNA TEXTILES', pageWidth / 2, 14, { align: 'center' });

                    // Party + Date bar
                    doc.setFillColor(255, 255, 255);
                    doc.rect(0, 22, pageWidth, 12, 'F');
                    doc.setDrawColor(40, 40, 40);
                    doc.setLineWidth(0.4);
                    doc.line(0, 34, pageWidth, 34);
                    doc.setTextColor(0, 0, 0);
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'bold');
                    doc.text(`Party: ${order.partyName}`, margin, 30);
                    doc.text(`Date: ${order.date}`, pageWidth - margin, 30, { align: 'right' });
                };

                drawHeader();

                // Grid: 4 columns x 3 rows = 12 samples per page
                const cols = 4;
                const rows = 3;
                const gridTop = 40;
                const usableWidth = pageWidth - margin * 2;
                const colWidth = usableWidth / cols;
                const imgSize = colWidth - 8;
                const rowHeight = imgSize + 14;

                let posOnPage = 0;

                for (let i = 0; i < order.samples.length; i++) {
                    const sample = order.samples[i];

                    if (posOnPage === cols * rows) {
                        doc.addPage();
                        drawHeader();
                        posOnPage = 0;
                    }

                    const col = posOnPage % cols;
                    const row = Math.floor(posOnPage / cols);
                    const xPos = margin + col * colWidth + 4;
                    const yPos = gridTop + row * rowHeight;

                    // Box border
                    doc.setDrawColor(220, 220, 220);
                    doc.setLineWidth(0.3);
                    doc.rect(xPos - 2, yPos - 2, imgSize + 4, imgSize + 14);

                    if (sample.photo) {
                        try {
                            doc.addImage(sample.photo, 'JPEG', xPos, yPos, imgSize, imgSize);
                        } catch (e) {
                            doc.setFillColor(230, 230, 230);
                            doc.rect(xPos, yPos, imgSize, imgSize, 'F');
                        }
                    }

                    doc.setFont(undefined, 'bold');
                    doc.setFontSize(9);
                    doc.setTextColor(0, 0, 0);
                    doc.text(`Qty: ${sample.quantity}`, xPos + imgSize / 2, yPos + imgSize + 7, { align: 'center' });

                    posOnPage++;
                }

                const fileName = `${order.partyName}_${order.date.replace(/\//g, '-')}.pdf`;
                const pdfBlob = doc.output('blob');
                const blobUrl = URL.createObjectURL(pdfBlob);
                const link = document.createElement('a');
                link.href = blobUrl;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
                return true;
            } catch (err) {
                console.error('PDF Error:', err);
                return false;
            }
        };

        function App() {
            const [screen, setScreen] = useState('home');
            const [orders, setOrders] = useState([]);
            const [partyName, setPartyName] = useState('');
            const [currentOrderSamples, setCurrentOrderSamples] = useState([]);
            const [selectedOrder, setSelectedOrder] = useState(null);
            const [photoPreview, setPhotoPreview] = useState(null);
            const [photoData, setPhotoData] = useState(null);
            const [quantity, setQuantity] = useState('');
            const [editingOrderId, setEditingOrderId] = useState(null);
            const cameraRef = useRef(null);

            // Load data on mount
            useEffect(() => {
                loadData();
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW:', err));
                }
            }, []);

            const loadData = async () => {
                try {
                    const db = await initDB();
                    const tx = db.transaction('orders', 'readonly');
                    const store = tx.objectStore('orders');
                    
                    store.getAll().onsuccess = (e) => {
                        const data = e.target.result || [];
                        setOrders(data);
                    };
                } catch (err) {
                    console.error('Load error:', err);
                }
            };

            const handlePhotoCapture = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        // Compress: max 900px on longer side, JPEG quality 0.6
                        const maxSize = 900;
                        let w = img.width;
                        let h = img.height;
                        if (w > h && w > maxSize) {
                            h = Math.round(h * (maxSize / w));
                            w = maxSize;
                        } else if (h > maxSize) {
                            w = Math.round(w * (maxSize / h));
                            h = maxSize;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressed = canvas.toDataURL('image/jpeg', 0.6);
                        setPhotoData(compressed);
                        setPhotoPreview(compressed);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleAddSample = () => {
                if (!photoData || !quantity) {
                    alert('Please capture photo and enter quantity');
                    return;
                }

                const newSample = {
                    id: Date.now(),
                    photo: photoData,
                    quantity: quantity,
                    sent: false
                };

                setCurrentOrderSamples([...currentOrderSamples, newSample]);
                setPhotoData(null);
                setPhotoPreview(null);
                setQuantity('');
            };

            const handleSaveOrder = async () => {
                if (!partyName || currentOrderSamples.length === 0) {
                    alert('Please enter party name and add samples');
                    return;
                }

                try {
                    const db = await initDB();

                    if (editingOrderId) {
                        // UPDATE existing order
                        const tx = db.transaction('orders', 'readwrite');
                        const store = tx.objectStore('orders');
                        store.get(editingOrderId).onsuccess = (e) => {
                            const existing = e.target.result;
                            const updatedOrder = {
                                ...existing,
                                partyName,
                                samples: currentOrderSamples
                            };
                            store.put(updatedOrder);
                            setTimeout(() => {
                                setPartyName('');
                                setCurrentOrderSamples([]);
                                setEditingOrderId(null);
                                setScreen('orders');
                                loadData();
                            }, 300);
                        };
                    } else {
                        // CREATE new order
                        const order = {
                            id: Date.now(),
                            partyName,
                            orderNumber: orders.length > 0 ? Math.max(...orders.map(o => o.orderNumber || 0)) + 1 : 1001,
                            date: new Date().toLocaleDateString(),
                            samples: currentOrderSamples,
                            status: 'pending'
                        };

                        const tx = db.transaction('orders', 'readwrite');
                        tx.objectStore('orders').add(order);

                        setTimeout(() => {
                            generatePDFFile(order);
                        }, 300);

                        setTimeout(() => {
                            setPartyName('');
                            setCurrentOrderSamples([]);
                            setScreen('orders');
                            loadData();
                        }, 500);
                    }
                } catch (err) {
                    console.error('Save error:', err);
                    alert('Error saving order');
                }
            };

            // Toggle sample "sent" status. Auto-complete + auto-delete order when all sent.
            const handleToggleSent = async (order, sampleId) => {
                try {
                    const db = await initDB();
                    const updatedSamples = order.samples.map(s =>
                        s.id === sampleId ? { ...s, sent: !s.sent } : s
                    );
                    const allSent = updatedSamples.every(s => s.sent);
                    const updatedOrder = { ...order, samples: updatedSamples, status: allSent ? 'complete' : 'pending' };

                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').put(updatedOrder);

                    if (allSent) {
                        // Show completed, then auto-delete after short delay
                        setSelectedOrder(updatedOrder);
                        setTimeout(async () => {
                            const db2 = await initDB();
                            const tx2 = db2.transaction('orders', 'readwrite');
                            tx2.objectStore('orders').delete(order.id);
                            setSelectedOrder(null);
                            setScreen('orders');
                            loadData();
                        }, 1200);
                    } else {
                        setSelectedOrder(updatedOrder);
                    }
                    loadData();
                } catch (err) {
                    console.error('Toggle error:', err);
                }
            };

            const handleCompleteOrder = async (orderId) => {
                try {
                    const db = await initDB();
                    const order = orders.find(o => o.id === orderId);
                    if (!order) return;

                    const updatedOrder = { ...order, status: 'complete' };
                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').put(updatedOrder);

                    loadData();
                } catch (err) {
                    alert('Error updating order');
                }
            };

            const handleDeleteOrder = async (id) => {
                if (!window.confirm('Delete this order?')) return;
                try {
                    const db = await initDB();
                    const tx = db.transaction('orders', 'readwrite');
                    tx.objectStore('orders').delete(id);
                    loadData();
                } catch (err) {
                    alert('Error deleting order');
                }
            };

            const handleBackup = () => {
                const data = {
                    orders: orders,
                    samples: samples,
                    backupDate: new Date().toISOString()
                };
                const dataStr = JSON.stringify(data, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `SKTOrders_Backup_${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                URL.revokeObjectURL(url);
            };

            const handleRestore = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        const db = await initDB();

                        // Clear and restore
                        let ordersTx = db.transaction('orders', 'readwrite');
                        ordersTx.objectStore('orders').clear();
                        data.orders.forEach(order => {
                            ordersTx.objectStore('orders').add(order);
                        });

                        let samplesTx = db.transaction('samples', 'readwrite');
                        samplesTx.objectStore('samples').clear();
                        data.samples.forEach(sample => {
                            samplesTx.objectStore('samples').add(sample);
                        });

                        alert('Data restored successfully!');
                        loadData();
                    } catch (err) {
                        alert('Error restoring backup');
                    }
                };
                reader.readAsText(file);
            };

            // HOME SCREEN with TAB navigation
            if (screen === 'home') {
                return (
                    <div className="min-h-screen bg-white overflow-x-hidden">
                        {/* Header */}
                        <div className="bg-gradient-to-b from-red-50 to-white p-6 text-center border-b-2 border-red-600">
                            <img src="./icon-192.png" alt="SKT" className="w-20 h-20 mx-auto mb-3 rounded-full shadow-lg" />
                            <h1 className="text-3xl font-bold text-red-600">SKT Orders</h1>
                            <p className="text-sm text-gray-600 mt-1">Shri Krishna Textiles</p>
                        </div>

                        {/* Tab Navigation */}
                        <div className="flex border-b-2 border-gray-200 bg-white sticky top-0 z-10">
                            <button
                                onClick={() => setScreen('home')}
                                className="flex-1 py-4 px-3 text-center font-bold text-red-600 border-b-4 border-red-600 transition"
                            >
                                📝 NEW ORDER
                            </button>
                            <button
                                onClick={() => setScreen('orders')}
                                className="flex-1 py-4 px-3 text-center font-bold text-gray-600 border-b-4 border-transparent hover:text-red-600 transition"
                            >
                                📋 ORDERS
                            </button>
                        </div>

                        {/* Content Area */}
                        <div className="w-full px-4 max-w-2xl mx-auto py-6 pb-20">
                            {/* NEW ORDER TAB CONTENT */}
                            <div className="space-y-4">
                                {/* Quick Actions */}
                                <div className="flex gap-2">
                                    <button
                                        onClick={handleBackup}
                                        className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-3 rounded-lg transition text-sm"
                                    >
                                        💾 BACKUP
                                    </button>
                                    <label className="flex-1 bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-3 rounded-lg text-center cursor-pointer transition text-sm">
                                        📥 RESTORE
                                        <input type="file" accept=".json" onChange={handleRestore} className="hidden" />
                                    </label>
                                </div>

                                {/* Info Box */}
                                <div className="bg-blue-50 border-2 border-blue-200 rounded-lg p-4">
                                    <p className="text-sm text-gray-700">
                                        <strong>Quick Start:</strong> Click the button below to create a new order and start adding samples!
                                    </p>
                                </div>

                                {/* Create Order Button */}
                                <button
                                    onClick={() => { setPartyName(''); setCurrentOrderSamples([]); setScreen('neworder'); }}
                                    className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-5 px-4 rounded-xl text-lg transition shadow-lg"
                                >
                                    ➕ CREATE NEW ORDER
                                </button>

                                {/* Stats */}
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-gray-100 rounded-lg p-4 text-center">
                                        <p className="text-2xl font-bold text-red-600">{orders.length}</p>
                                        <p className="text-xs text-gray-600">Total Orders</p>
                                    </div>
                                    <div className="bg-gray-100 rounded-lg p-4 text-center">
                                        <p className="text-2xl font-bold text-green-600">{orders.filter(o => o.status === 'complete').length}</p>
                                        <p className="text-xs text-gray-600">Completed</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // NEW ORDER SCREEN
            if (screen === 'neworder') {
                return (
                    <div className="min-h-screen bg-gray-50 overflow-x-hidden pb-24">
                        <div className="bg-red-600 text-white p-4 flex items-center gap-3 sticky top-0 z-10 shadow">
                            <button onClick={() => { setEditingOrderId(null); setPartyName(''); setCurrentOrderSamples([]); setScreen('home'); }} className="hover:bg-red-700 p-2 rounded-lg">
                                ← BACK
                            </button>
                            <h1 className="text-xl font-bold flex-1 truncate">{editingOrderId ? 'Edit Order' : 'New Order'}</h1>
                        </div>

                        <div className="w-full px-3 max-w-2xl mx-auto mt-4">
                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Party Name *</label>
                                <input
                                    type="text"
                                    value={partyName}
                                    onChange={(e) => setPartyName(e.target.value)}
                                    placeholder="Enter party name"
                                    className="w-full px-3 py-3 border-2 border-gray-300 rounded-lg focus:border-red-600 focus:outline-none text-lg"
                                />
                            </div>

                            <div className="mb-4">
                                <label className="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                                <input
                                    type="text"
                                    value={new Date().toLocaleDateString()}
                                    disabled
                                    className="w-full px-3 py-3 border-2 border-gray-300 rounded-lg bg-gray-100 text-gray-600"
                                />
                            </div>

                            {/* Photo Section */}
                            {!photoPreview && (
                                <div className="mb-4">
                                    <button
                                        onClick={() => cameraRef.current?.click()}
                                        className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-5 px-4 rounded-lg text-2xl transition"
                                    >
                                        📷 TAKE PHOTO
                                    </button>
                                    <input
                                        ref={cameraRef}
                                        type="file"
                                        accept="image/*"
                                        capture="environment"
                                        onChange={handlePhotoCapture}
                                        className="hidden"
                                    />
                                </div>
                            )}

                            {/* Photo Preview + Quantity */}
                            {photoPreview && (
                                <div className="mb-4 bg-white p-4 rounded-lg shadow">
                                    <div className="text-center mb-3">
                                        <img src={photoPreview} alt="Preview" className="w-full max-w-xs h-64 object-cover rounded-lg mx-auto" />
                                    </div>
                                    
                                    <div className="mb-4">
                                        <label className="block text-sm font-semibold text-gray-700 mb-2">📦 Quantity *</label>
                                        <input
                                            type="text"
                                            value={quantity}
                                            onChange={(e) => setQuantity(e.target.value)}
                                            placeholder="e.g. 5 or 5-5-5 or 5 peela 5 chudni"
                                            autoFocus
                                            className="w-full px-3 py-3 border-2 border-red-600 rounded-lg focus:border-red-600 focus:outline-none text-lg font-bold"
                                        />
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={handleAddSample}
                                            className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg text-lg"
                                        >
                                            ✓ ADD
                                        </button>
                                        <button
                                            onClick={() => { setPhotoData(null); setPhotoPreview(null); setQuantity(''); }}
                                            className="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-lg text-lg"
                                        >
                                            ✕ RETAKE
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Added Samples */}
                            <div className="mb-4">
                                <h3 className="font-bold text-gray-800 mb-2">📦 Samples Added ({currentOrderSamples.length})</h3>
                                <div className="space-y-2">
                                    {currentOrderSamples.map((sample, idx) => (
                                        <div key={sample.id} className="bg-white p-2 rounded-lg flex items-center gap-3 shadow">
                                            <img src={sample.photo} alt="Sample" className="w-14 h-14 object-cover rounded-lg" />
                                            <span className="flex-1 font-semibold">{idx + 1}. Qty: <span className="text-red-600">{sample.quantity}</span></span>
                                            <button
                                                onClick={() => setCurrentOrderSamples(currentOrderSamples.filter(s => s.id !== sample.id))}
                                                className="text-red-600 hover:bg-red-50 px-3 py-2 rounded"
                                            >
                                                🗑️
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Save Button */}
                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg border-t-2 border-red-600">
                            <button
                                onClick={handleSaveOrder}
                                className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-lg transition"
                            >
                                {editingOrderId ? '💾 UPDATE ORDER' : '💾 SAVE & PDF'}
                            </button>
                        </div>
                    </div>
                );
            }

            // ORDERS SCREEN
            if (screen === 'orders') {
                if (selectedOrder) {
                    return (
                        <div className="min-h-screen bg-gray-50 overflow-x-hidden pb-24">
                            <div className="bg-red-600 text-white p-4 flex items-center gap-3 sticky top-0 z-10 shadow">
                                <button
                                    onClick={() => setSelectedOrder(null)}
                                    className="hover:bg-red-700 p-2 rounded-lg"
                                >
                                    ← BACK
                                </button>
                                <h1 className="text-xl font-bold flex-1 truncate">Order #{selectedOrder.orderNumber}</h1>
                            </div>

                            <div className="w-full px-3 max-w-2xl mx-auto mt-4">
                                <div className="bg-white p-4 rounded-lg shadow mb-4">
                                    <p className="mb-2"><strong>Party:</strong> {selectedOrder.partyName}</p>
                                    <p className="mb-2"><strong>Date:</strong> {selectedOrder.date}</p>
                                    <p><strong>Status:</strong> <span className={selectedOrder.status === 'complete' ? 'text-green-600' : 'text-blue-600'}>{selectedOrder.status}</span></p>
                                </div>

                                <h3 className="font-bold text-gray-800 mb-3">📦 Samples ({selectedOrder.samples.length}) — Tick jo bhej diye</h3>
                                <div className="space-y-3 mb-20">
                                    {selectedOrder.samples.map((sample, idx) => (
                                        <div key={sample.id} className={`p-3 rounded-lg shadow flex gap-3 items-center ${sample.sent ? 'bg-green-100' : 'bg-white'}`}>
                                            <img src={sample.photo} alt="Sample" className="w-20 h-20 object-cover rounded-lg" />
                                            <div className="flex-1">
                                                <p className="font-semibold">📦 Qty: {sample.quantity}</p>
                                                {sample.sent && <p className="text-green-600 text-sm font-bold">✓ Sent</p>}
                                            </div>
                                            <button
                                                onClick={() => handleToggleSent(selectedOrder, sample.id)}
                                                className={`w-10 h-10 rounded-full border-2 flex items-center justify-center text-xl font-bold ${
                                                    sample.sent ? 'bg-green-600 border-green-600 text-white' : 'bg-white border-gray-300 text-gray-300'
                                                }`}
                                            >
                                                ✓
                                            </button>
                                        </div>
                                    ))}
                                </div>

                                <div className="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg border-t-2 border-red-600 max-w-2xl mx-auto">
                                    <div className="flex gap-2">
                                        <button
                                            onClick={() => {
                                                generatePDFFile(selectedOrder);
                                            }}
                                            className="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            📄 PDF
                                        </button>
                                        <button
                                            onClick={() => {
                                                setPartyName(selectedOrder.partyName);
                                                setCurrentOrderSamples(selectedOrder.samples);
                                                setEditingOrderId(selectedOrder.id);
                                                setSelectedOrder(null);
                                                setScreen('neworder');
                                            }}
                                            className="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✏️ EDIT
                                        </button>
                                        <button
                                            onClick={() => {
                                                handleCompleteOrder(selectedOrder.id);
                                                setSelectedOrder(null);
                                            }}
                                            className="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            ✓ DONE
                                        </button>
                                        <button
                                            onClick={() => {
                                                handleDeleteOrder(selectedOrder.id);
                                                setSelectedOrder(null);
                                            }}
                                            className="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg"
                                        >
                                            🗑️ DELETE
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="min-h-screen bg-white overflow-x-hidden">
                        {/* Header */}
                        <div className="bg-red-600 text-white p-3 flex items-center gap-2 sticky top-0 z-10 shadow">
                            <img src="./icon-192.png" alt="SKT" className="w-6 h-6 rounded" />
                            <h1 className="text-lg font-bold flex-1 truncate">SKT Orders</h1>
                        </div>

                        {/* Tab Navigation */}
                        <div className="flex border-b-2 border-gray-200 bg-white sticky top-12 z-10">
                            <button
                                onClick={() => setScreen('home')}
                                className="flex-1 py-4 px-3 text-center font-bold text-gray-600 border-b-4 border-transparent hover:text-red-600 transition text-sm"
                            >
                                📝 NEW ORDER
                            </button>
                            <button
                                onClick={() => setScreen('orders')}
                                className="flex-1 py-4 px-3 text-center font-bold text-red-600 border-b-4 border-red-600 transition text-sm"
                            >
                                📋 ORDERS ({orders.length})
                            </button>
                        </div>

                        <div className="w-full px-3 max-w-2xl mx-auto py-4 pb-20">
                            <div className="space-y-3">
                                {orders.map((order) => (
                                    <div
                                        key={order.id}
                                        onClick={() => setSelectedOrder(order)}
                                        className={`p-4 rounded-lg shadow cursor-pointer transition ${
                                            order.status === 'complete' ? 'bg-green-100' : 'bg-white hover:shadow-lg'
                                        }`}
                                    >
                                        <div className="flex justify-between items-start">
                                            <div>
                                                <p className="font-bold text-gray-800">#{order.orderNumber}</p>
                                                <p className="text-gray-600">{order.partyName}</p>
                                                <p className="text-sm text-gray-500">{order.date} • {order.samples.length} samples</p>
                                            </div>
                                            <span className={`px-3 py-1 rounded-full text-sm font-semibold ${
                                                order.status === 'complete' ? 'bg-green-200 text-green-800' : 'bg-blue-200 text-blue-800'
                                            }`}>
                                                {order.status === 'complete' ? '✓ Complete' : 'Pending'}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            {orders.length === 0 && (
                                <p className="text-center text-gray-500 mt-10">No orders yet</p>
                            )}
                        </div>
                    </div>
                );
            }

            return null;
        }

        ReactDOM.render(<App />, document.getElementById('root'));

        // Service Worker registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./service-worker.js').catch(err => console.log('SW Error:', err));
        }
    </script>
</body>
</html>
